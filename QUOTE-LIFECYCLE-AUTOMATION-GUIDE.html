 revision or a variation.","passed-review-to-sent":"The first Quote already exists here. WeQuote would need you to choose between another option, a revision or a variation.","sent-to-outcome":"The first Quote already exists here. WeQuote would need you to choose between another option, a revision or a variation."},"defaultUnavailableReason":"Create the first Quote is available only while the Deal is Qualified and still has no current Quote."},"createAnotherQuoteOption":{"id":"QS-A02","label":"Create another Quote option","scopeLabel":"In Progress only","allowedContextIds":["in-progress"],"allowedPlacementIds":["in-progress-to-in-review"],"settings":"Available only while the Deal is In Progress and already has a current Quote. It creates another separate option, not a revision or variation.","result":"Creates a separate empty Quote option for the same Deal. It starts at In Progress and is not sent. A later, separate run may create another option.","evidence":"WeQuote must group the Quote options and make sure the same Automation run does not create a duplicate.","guardrails":["Check that the Deal is still In Progress and already has a current Quote.","One Automation run creates no more than one additional option.","A later, separate run may create another option.","Create a separate Quote option, never a revision or variation.","Link it to the same Deal and create it empty, In Progress and not sent.","WeQuote uses the Quote that has moved furthest through the Quote Stages to set the Deal Stage. If one option is accepted, it wins and the other options become Lost."],"contextUnavailableReasons":{"qualified":"No related Quote exists yet. Use Create first related Quote instead.","in-review":"At this Stage, the user must choose clearly between another Quote option, a revision or a variation. WeQuote does not guess.","passed-review":"At this Stage, the user must choose clearly between another Quote option, a revision or a variation. WeQuote does not guess.","sent":"At this Stage, the user must choose clearly between another Quote option, a revision or a variation. WeQuote does not guess.","won":"The Deal is already Won, so another Quote option cannot be created here.","lost":"The Deal is already Lost, so another Quote option cannot be created here."},"placementUnavailableReasons":{"qualified-to-in-progress":"No Quote exists yet here. Use Create the first Quote for this Deal instead.","in-review-to-passed-review":"You must choose clearly between another Quote option, a revision and a variation. That choice is not available yet.","passed-review-to-sent":"You must choose clearly between another Quote option, a revision and a variation. That choice is not available yet.","sent-to-outcome":"You must choose clearly between another Quote option, a revision and a variation. That choice is not available yet."},"defaultUnavailableReason":"Create another Quote option is available only while the Deal is In Progress and already has a current Quote."}},"placements":[{"id":"qualified-to-in-progress","label":"Between Qualified and In Progress","shortLabel":"Before the first Quote","context":"The Deal is Qualified, but it does not yet have a current Quote.","example":"Examples: Site Ready, Discovery Complete or Requirements Confirmed.","triggerIds":[],"ruleIds":["Q-R01","Q-R02"],"quoteActionIds":["QS-A01"],"nextEvent":"When the first Quote is created or linked, it starts at In Progress. WeQuote then moves the Deal to In Progress."},{"id":"in-progress-to-in-review","label":"Between In Progress and In Review","shortLabel":"While Quote options are being prepared","context":"At least one current Quote already exists and can still be edited. In Progress therefore means the first Quote already exists.","example":"Examples: Costing Complete, Scope Confirmed or Ready for Review.","triggerIds":["IP-T02","IP-T03"],"ruleIds":["IP-R01","IP-R03"],"quoteActionIds":["QS-A02"],"nextEvent":"Create another Quote option adds a separate option, not a revision or variation. WeQuote uses the Quote that has moved furthest through the Quote Stages to set the Deal Stage. Sending an option for review moves the Deal when appropriate."},{"id":"in-review-to-passed-review","label":"Between In Review and Passed Review","shortLabel":"While the Quote is being reviewed","context":"A Quote is in an official internal review and the Deal is waiting for the result.","example":"Examples: Commercial Check, Technical Check or Director Sign-off.","triggerIds":["IR-T01","IR-T02"],"ruleIds":["IR-R01","IR-R02","IR-R03"],"quoteActionIds":[],"nextEvent":"A passed review moves the Deal to Passed Review. If changes are requested, the relevant Quote returns to In Progress."},{"id":"passed-review-to-sent","label":"Between Passed Review and Sent","shortLabel":"After review, before sending","context":"A Quote passed review but has not been successfully sent to the customer yet.","example":"Examples: Final Pack Check, Customer Details Check or Ready to Send.","triggerIds":["PR-T01"],"ruleIds":["PR-R01","PR-R03","PR-R04","PR-R05"],"quoteActionIds":[],"nextEvent":"When the Quote is sent successfully, WeQuote moves the Deal to Sent."},{"id":"sent-to-outcome","label":"Between Sent and Won / Lost","shortLabel":"After sending, before the result","context":"At least one current Quote was sent and the Deal is waiting for the customer result.","example":"Examples: Follow-up, Negotiation or Decision Pending.","triggerIds":["SE-T01","SE-T02","SE-T03"],"ruleIds":["SE-R01","SE-R02","SE-R03","SE-R04","SE-R05"],"quoteActionIds":[],"nextEvent":"WeQuote uses the Quote that has moved furthest through the Quote Stages to set the Deal Stage. An accepted option makes the Deal Won and the other options Lost. If no option can continue, WeQuote decides the Deal result."}],"stageActionMatrix":[{"context":"Qualified","customSegment":"Qualified → In Progress (for example, Site Ready)","available":"Create the first Quote for this Deal","boundary":"Only when the Deal is still Qualified and has no current Quote. Creates one empty, not-sent Quote at In Progress, then moves the Deal to In Progress."},{"context":"In Progress","customSegment":"In Progress → In Review","available":"Create another Quote option","boundary":"Creates a separate Quote option for the same Deal. It is not a revision or variation."},{"context":"In Review / Passed Review / Sent","customSegment":"Later Quote Stages","available":"No Create Quote Action yet","boundary":"The user would need to choose clearly between another Quote option, a revision or a variation. That choice is not available yet."},{"context":"Won / Lost","customSegment":"Final results","available":"No Create Quote Action","boundary":"The Deal is already Won or Lost, so a new Quote cannot be created here."},{"context":"Standalone Pipeline","customSegment":"Not connected to the Quote lifecycle","available":"Deal Actions only","boundary":"Quote Starts when, Rules and Actions are not shown."}]},"standalone":{"title":"Standalone Pipeline","defaultStageName":"My working Stage","constantTitle":"Deal choices stay the same","constantBody":"Every working Stage gets the same 9 ways to start, 11 Rules and 15 Actions.","changesTitle":"You control the working process","changesBody":"You choose the Pipeline name, Stage names and order. Quote changes do not move a Deal through this Pipeline.","recommendedStages":["New","In Progress","Complete"],"protectedResults":["Won","Lost"],"movement":"Users can move a Deal between named working Stages. Automatic Stage movement is not available yet. The team must first decide which Stages can be chosen, who may use it, how repeats are stopped, and what work must be complete.","quoteWarning":"A Standalone Pipeline gets Deal choices only. It does not show Quote-specific Starts when choices, Rules, Create Quote Actions or automatic Quote Stage changes."},"tabs":{"triggers":"Starts when","rules":"Rules","actions":"Actions","movement":"Stage movement"},"movement":{"quote":{"heading":"Who moves this Stage?","body":"A user can place the Deal in a named Custom Stage. WeQuote moves the fixed Quote Stages only after the matching Quote change happens.","decision":"Automatic Stage movement is not available yet. It must never choose a fixed Quote Stage or skip required work."},"standalone":{"heading":"Who moves this Stage?","body":"A user moves the Deal between the Pipeline's named working Stages. WeQuote still controls Won and Lost.","decision":"Automatic Stage movement is not available yet. The team must first decide which Stages can be chosen, who may use it, how repeats are stopped, and what work must be complete."}}}}</script>
  <script>(function clientRuntime() {
  const data = JSON.parse(document.getElementById('quote-lifecycle-data').textContent);
  if (data.actions?.A11) {
    data.actions.A11.availability = 'withheld';
    data.actions.A11.readiness = 'withheld';
    data.actions.A11.evidence = 'Remove Interest remains a manual CRM operation. Automation may add an Interest only from clear, structured evidence, but it must not erase customer-need history automatically.';
    data.actions.A11.unavailableReason = 'Removing an Interest could erase useful customer-need history. Keep this as a manual CRM decision.';
  }
  if (data.actions?.A09) {
    data.actions.A09.settings = 'Choose one system- or Automation-managed Label that this Automation is allowed to clear.';
    data.actions.A09.result = 'Removes only the matching managed Label. It must not remove a Label that a user added by hand.';
    data.actions.A09.evidence = 'Deal Labels exist. Automation still needs managed ownership and permission checks before a Label can be removed.';
  }
  const selectableActionIds = (ids = []) => ids.filter((id) => data.actions?.[id]?.availability !== 'withheld');
  data.contexts.forEach((item) => { item.actionIds = selectableActionIds(item.actionIds); });
  if (data.customStageGuide?.shared) {
    data.customStageGuide.shared.actionIds = selectableActionIds(data.customStageGuide.shared.actionIds);
  }
  if (data.customStageGuide?.quote) {
    data.customStageGuide.quote.constantBody = 'You always get the same Deal choices: 9 ways to start, 11 Rules and 14 selectable Actions.';
  }
  if (data.customStageGuide?.standalone) {
    data.customStageGuide.standalone.constantBody = 'Every working Stage gets the same 9 ways to start, 11 Rules and 14 selectable Actions.';
  }
  data.counts.actions = Object.values(data.actions || {}).filter((item) => item.availability !== 'withheld').length;
  const root = document.getElementById('qlce-root');
  const beginnerView = data.source.locale === 'en-simple';
  const state = {
    mode: 'catalogue',
    stageId: 'in-progress',
    triggerId: 'IP-T03',
    recipeId: 'IP-C10',
    search: '',
    catalogueType: 'triggers',
    pricingFilter: 'any',
    waitKind: 'none',
    ruleJoin: 'and',
    ruleIds: new Set(),
    yesActionIds: new Set(),
    noActionIds: new Set(),
    noPathOpen: false,
    advancedOpen: false,
    sampleTestOpen: false,
    sampleTestBranch: 'yes',
    customStageKind: 'quote',
    customPlacementId: 'qualified-to-in-progress',
    customBlockType: 'triggers',
    quoteCustomStageName: 'Site Ready',
    standaloneCustomStageName: 'My working Stage',
  };

  const esc = (value = '') => String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

  const context = () => data.contexts.find((item) => item.id === state.stageId);
  const selectedTrigger = () => data.triggers[state.triggerId];
  const recipeById = (id) => [...data.recipes, ...data.withheldRecipes].find((item) => item.id === id);
  const setEqual = (left, right) => left.size === right.size && [...left].every((value) => right.has(value));
  const waitKind = (text) => /none|no wait/i.test(text) ? 'none' : 'days';
  const recipeRuleJoin = (recipe) => /\bOR\b/.test(recipe?.condition || '') ? 'or' : 'and';
  const ruleJoinLabel = () => state.ruleJoin === 'or' ? 'OR' : 'AND';

  const quoteSpecificActionList = () => Object.values(data.customStageGuide?.quote?.quoteSpecificActions || {});
    const quoteActionsForContext = (contextId) => quoteSpecificActionList().map((action) => {
      const allowed = action.allowedContextIds.includes(contextId);
      return {
        ...action,
        availability: allowed ? 'selectable' : 'withheld',
        unavailableReason: allowed ? '' : (action.contextUnavailableReasons?.[contextId] || action.defaultUnavailableReason),
      };
    });
    const quoteActionsForPlacement = (placementId) => quoteSpecificActionList().map((action) => {
      const allowed = action.allowedPlacementIds.includes(placementId);
      return {
        ...action,
        availability: allowed ? 'selectable' : 'withheld',
        unavailableReason: allowed ? '' : (action.placementUnavailableReasons?.[placementId] || action.defaultUnavailableReason),
      };
    });
    const quoteActionMatrixNote = (items, heading = 'Quote-specific Action guardrails') => `<div class="qlce-quote-action-note"><strong>${esc(heading)}</strong>${items.map((item) => `<p class="${item.availability === 'selectable' ? 'is-available' : 'is-unavailable'}"><b>${esc(item.label)} — ${item.availability === 'selectable' ? 'available' : 'unavailable'}</b><span>${esc(item.availability === 'selectable' ? item.result : item.unavailableReason)}</span></p>`).join('')}</div>`;
  const ruleCompatibility = (triggerId, ruleId) => {
    if (state.waitKind === 'days') return { allowed: true, reason: '' };
    const directBlocks = {
      'Q-T01': ['Q-R01', 'Q-R02'],
      T06: ['R04'],
      T07: ['R06'],
      T08: ['R11'],
      'IP-T01': ['IP-R01'],
      'IR-T01': ['IR-R01'],
      'PR-T01': ['PR-R01'],
      'SE-T01': ['SE-R01', 'SE-R02', 'SE-R03', 'SE-R04', 'SE-R05'],
      'SE-T02': ['SE-R02', 'SE-R03'],
      'SE-T03': ['SE-R01', 'SE-R04', 'SE-R05'],
      'W-T01': ['W-R01'],
      'W-T02': ['W-R01'],
      'L-T01': ['L-R02'],
    };
    if (!(directBlocks[triggerId] || []).includes(ruleId)) return { allowed: true, reason: '' };
    if (triggerId === 'T08' && ruleId === 'R11') {
      return { allowed: false, reason: 'This flow starts only when an Expected Close Date exists and is getting close, so checking whether that date is missing would never pass.' };
    }
    return { allowed: false, reason: 'Starts when has already confirmed this information. Choose a different check, or add a Wait before checking the same information again.' };
  };

  const readinessLabel = {
    live: 'Available',
    'adapter-required': 'Needs a data connection',
    'new-runtime': 'Needs new Automation work',
    proposed: 'Team decision needed',
    withheld: 'Not available yet',
  };

  const absoluteReadiness = (recipe) => data.buildReadinessDefinitions[recipe?.buildReadiness || 'phase1-build-required'];
  const phase1Scope = (recipe) => data.phase1ScopeDefinitions[recipe?.phase1Scope || 'scope-change'];
  const blockerList = (recipe) => (recipe?.blockerIds || []).map((id) => ({ id, ...data.blockerDefinitions[id] }));

  const icon = (name) => ({
    check: '✓', lock: '⌁', warning: '!', arrow: '→', dot: '•', copy: '⧉', reset: '↺',
  }[name] || '•');

  const stageNav = () => `
    <nav class="qlce-stage-nav" aria-label="Quote lifecycle stage">
      ${data.contexts.map((item, index) => `
        <button type="button" class="qlce-stage ${item.id === state.stageId ? 'is-active' : ''}"
          data-stage="${esc(item.id)}" aria-current="${item.id === state.stageId ? 'step' : 'false'}"
          style="--stage-accent:${esc(item.accent)}">
          <span class="qlce-stage-index">${String(index + 1).padStart(2, '0')}</span>
          <span>${esc(item.label)}</span>
          <small>${esc(item.type)}</small>
        </button>
      `).join('')}
    </nav>`;

  const modeNav = () => {
    const modes = [
      ['catalogue', 'Choices by Quote context'],
      ['recipes', 'Reviewed examples'],
      ['build', 'Try a Custom flow'],
    ];
    if (data.customStageGuide) modes.push(['custom-stages', data.customStageGuide.modeLabel]);
    return `
    <div class="qlce-mode-nav" role="tablist" aria-label="Guide section">
      ${modes.map(([id, label]) => `
        <button type="button" role="tab" aria-selected="${state.mode === id}" class="${state.mode === id ? 'is-active' : ''}" data-mode="${id}">${label}</button>
      `).join('')}
    </div>`;
  };

  const statusPill = (label, kind) => `<span class="qlce-pill qlce-pill-${esc(kind)}">${esc(label)}</span>`;

  const triggerList = () => {
    const current = context();
    const groups = [
      ['Only for this Quote context', current.triggerIds],
      ['Also available in every Quote context', data.contexts[0].selectableTriggerIds.filter((id) => /^T\d{2}$/.test(id))],
      ['Not available yet', current.disabledTriggerIds],
    ];
    return groups.map(([label, ids]) => ids.length ? `
      <div class="qlce-list-group">
        <h3>${esc(label)}</h3>
        ${ids.map((id) => {
          const item = data.triggers[id];
          const selected = id === state.triggerId;
          return `<button type="button" class="qlce-trigger-option ${beginnerView ? 'is-beginner' : ''} ${selected ? 'is-active' : ''} ${item.availability === 'withheld' ? 'is-disabled' : ''}"
            data-trigger="${esc(id)}" ${item.availability === 'withheld' ? 'aria-disabled="true"' : ''}>
            ${beginnerView ? `<span>${esc(item.label)}</span>` : `<span class="qlce-id">${esc(id)}</span><span>${esc(item.label)}</span><small>${esc(readinessLabel[item.readiness])}</small>`}
          </button>`;
        }).join('')}
      </div>` : '').join('');
  };

  const triggerContractView = () => {
    const item = selectedTrigger();
    if (!item) return '';
    const fields = beginnerView ? [
      ['Starts when', item.firesWhen],
      ['What you choose', item.settings],
      ['Does not start when', item.exclusions],
    ] : [
      ['It starts when', item.firesWhen],
      ['It checks', item.observedObject],
      ['You choose', item.settings],
      ['It does not start when', item.exclusions],
      ['How WeQuote avoids doing it twice', item.idempotencyKey],
      ['When it can start again', item.rearm],
    ];
    return `
      <article class="qlce-contract">
        <div class="qlce-contract-heading">
          <div>${beginnerView ? '' : `<span class="qlce-id">${esc(item.id)}</span>`}<h2>${esc(item.label)}</h2></div>
          ${beginnerView ? '' : statusPill(readinessLabel[item.readiness], item.readiness)}
        </div>
        <dl>${fields.map(([term, value]) => `<div><dt>${esc(term)}</dt><dd>${esc(value || 'This has not been decided yet.')}</dd></div>`).join('')}</dl>
        ${beginnerView ? '' : `<details><summary>Product notes</summary><p>${esc(item.evidence)}</p></details>`}
      </article>`;
  };

  const recipesForSelection = () => {
    const term = state.search.trim().toLowerCase();
    const triggerId = state.triggerId;
    const applicable = data.recipes.filter((recipe) => {
      const sameContext = recipe.contextId === state.stageId || recipe.contextId === 'shared';
      const sameTrigger = recipe.triggerIds.includes(triggerId);
      const haystack = `${recipe.id} ${recipe.title} ${recipe.when} ${recipe.condition} ${recipe.yes} ${recipe.no} ${recipe.reason}`.toLowerCase();
      return sameContext && sameTrigger && (!term || haystack.includes(term));
    });
    const withheld = data.withheldRecipes.filter((recipe) => recipe.contextId === state.stageId && recipe.triggerIds.includes(triggerId));
    return [...applicable, ...withheld];
  };

  const recipeCard = (recipe) => `
    <button type="button" class="qlce-recipe-card ${state.recipeId === recipe.id ? 'is-active' : ''} ${recipe.status === 'withheld' ? 'is-withheld' : ''}" data-recipe="${esc(recipe.id)}">
      ${beginnerView
        ? (recipe.status === 'withheld' ? `<span class="qlce-recipe-top">${statusPill('Not available yet', 'withheld')}</span>` : '')
        : `<span class="qlce-recipe-top"><span class="qlce-id">${esc(recipe.id)}</span>${statusPill(recipe.status === 'candidate' ? 'Example' : 'Withheld', recipe.status)}</span>`}
      <strong>${esc(recipe.title)}</strong>
      <span>${esc(recipe.reason)}</span>
    </button>`;

  const flowRows = (recipe) => (beginnerView ? [
    ['when', 'WHEN', recipe.when],
    ['wait', 'WAIT', recipe.wait],
    ['if', 'CHECK FIRST', recipe.condition],
    ['yes', 'THEN DO', recipe.yes],
    ['no', 'IF NOT', recipe.no],
  ] : [
    ['when', 'STARTS WHEN', recipe.when],
    ['wait', 'THEN WAIT (OPTIONAL)', recipe.wait],
    ['if', 'RULE (OPTIONAL)', recipe.condition],
    ['yes', 'YES — ACTIONS', recipe.yes],
    ['no', 'NO — ACTIONS / END', recipe.no],
  ]).map(([kind, label, value]) => `<div class="qlce-flow-row qlce-flow-${kind}"><span>${label}</span><p>${esc(value)}</p></div>`).join('');

  const scenarioText = (recipe) => (beginnerView ? [
    `FLOW: ${recipe.title}`,
    `WHEN: ${recipe.when}`,
    `WAIT: ${recipe.wait}`,
    `CHECK FIRST: ${recipe.condition}`,
    `THEN DO: ${recipe.yes}`,
    `IF NOT: ${recipe.no}`,
    `WHY: ${recipe.reason}`,
  ] : [
    `EXAMPLE: ${recipe.title}`,
    `WHEN ${recipe.when}`,
    `WAIT ${recipe.wait}`,
    `RULE (OPTIONAL) ${recipe.condition}`,
    `YES — ACTIONS ${recipe.yes}`,
    `NO — ACTIONS / END ${recipe.no}`,
    `WHY THIS IS USEFUL ${recipe.reason}`,
  ]).join('\n');

  const recipeDetail = () => {
    const available = recipesForSelection();
    let recipe = recipeById(state.recipeId);
    if (!recipe || !available.some((item) => item.id === recipe.id)) recipe = available[0];
    if (!recipe) return `<div class="qlce-empty"><strong>There is no example for this start choice yet.</strong><p>You can still build your own combination in Try a Custom flow.</p></div>`;
    state.recipeId = recipe.id;
    const scope = phase1Scope(recipe);
    const readiness = absoluteReadiness(recipe);
    const blockers = blockerList(recipe);
    return `
      <article class="qlce-detail-card">
        <div class="qlce-detail-heading">
          <div>${beginnerView ? '' : `<span class="qlce-id">${esc(recipe.id)}</span>`}<h2>${esc(recipe.title)}</h2></div>
          ${beginnerView
            ? (recipe.status === 'withheld' ? statusPill('Not available yet', 'withheld') : '')
            : statusPill(recipe.status === 'candidate' ? 'Reviewed example' : 'Withheld', recipe.status)}
        </div>
        <div class="qlce-flow">${flowRows(recipe)}</div>
        <div class="qlce-reason"><span>${beginnerView ? 'Why use this flow?' : 'Why this is useful'}</span><p>${esc(recipe.reason)}</p></div>
        ${beginnerView ? '' : `<div class="qlce-dual-status">
          <div><small>Example status</small><strong>${recipe.status === 'candidate' ? 'Reviewed example' : 'Cannot be used'}</strong></div>
          <div><small>Phase 1 scope</small><strong>${esc(scope.label)}</strong><span>${esc(scope.detail)}</span></div>
          <div><small>Product notes</small><strong>${esc(readiness.label)}</strong><span>${esc(readiness.detail)}</span></div>
          <div><small>Where it starts</small><strong>${esc(data.eventScopeDefinitions[recipe.eventScope])}</strong><span>The flow only changes internal Deal or CRM work. It cannot move a WeQuote-managed stage or send anything to the customer.</span></div>
        </div>
        <div class="qlce-blockers"><strong>What must be built</strong><ul>${blockers.map((item) => `<li><span class="qlce-id">${esc(item.id)}</span><div><b>${esc(item.label)}</b><small>${esc(item.detail)}</small></div></li>`).join('')}</ul></div>`}
        <div class="qlce-actions-row">
          <button type="button" class="qlce-primary" data-load-recipe="${esc(recipe.id)}" ${recipe.status === 'withheld' ? 'disabled' : ''}>${beginnerView ? (recipe.status === 'withheld' ? 'Cannot try this yet' : 'Try this flow') : 'Try this flow'}</button>
          <button type="button" data-copy="scenario" data-copy-id="${esc(recipe.id)}">${icon('copy')} ${beginnerView ? 'Copy flow' : 'Copy example'}</button>
        </div>
      </article>`;
  };

  const recipesMode = () => {
    const current = context();
    const list = recipesForSelection();
    return `
      <section class="qlce-mode-panel" role="tabpanel">
        <div class="qlce-context-strip" style="--stage-accent:${esc(current.accent)}">
          <div><span>${esc(current.type)}</span><h2>${esc(current.label)}</h2><p>${esc(current.meaning)}</p></div>
          <div><small>${beginnerView ? 'Works with' : 'Main record'}</small><strong>${esc(current.primaryRecord)}</strong></div>
        </div>
        <div class="qlce-workbench">
          <aside class="qlce-pane qlce-trigger-pane"><div class="qlce-pane-title"><span>1</span><h2>${beginnerView ? 'Choose what starts it' : 'Choose what starts it'}</h2></div>${triggerList()}</aside>
          <section class="qlce-pane qlce-recipe-pane">
            <div class="qlce-pane-title"><span>2</span><div><h2>${beginnerView ? 'Pick an example' : 'Choose an example'}</h2><p>${list.length} ${beginnerView ? `example${list.length === 1 ? '' : 's'}` : 'match this Trigger'}</p></div></div>
            ${triggerContractView()}
            <div class="qlce-recipe-list">${list.map(recipeCard).join('') || '<p class="qlce-muted">No example matches your search.</p>'}</div>
          </section>
          <aside class="qlce-pane qlce-detail-pane"><div class="qlce-pane-title"><span>3</span><h2>${beginnerView ? 'See what happens' : 'See what happens'}</h2></div>${recipeDetail()}</aside>
        </div>
      </section>`;
  };

  const optionList = (items, selectedIds, kind, disabledIds = []) => items.map((item) => {
    const disabled = disabledIds.includes(item.id) || item.availability === 'withheld';
    const checked = selectedIds.has(item.id);
    return `<label class="qlce-check-option ${disabled ? 'is-disabled' : ''}">
      <input type="checkbox" data-option-kind="${kind}" value="${esc(item.id)}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
      <span><strong>${beginnerView ? '' : `<span class="qlce-id">${esc(item.id)}</span> `}${esc(item.label)}</strong><small>${esc(disabled ? readinessLabel[item.readiness] : (item.settings || item.result))}</small></span>
    </label>`;
  }).join('');

  const exactRecipeMatch = () => {
    const candidates = data.recipes.filter((recipe) => {
      if (!(recipe.contextId === state.stageId || recipe.contextId === 'shared')) return false;
      if (!recipe.triggerIds.includes(state.triggerId)) return false;
      if (waitKind(recipe.wait) !== state.waitKind) return false;
      if (state.ruleIds.size > 1 && recipe.ruleIds.length > 1 && recipeRuleJoin(recipe) !== state.ruleJoin) return false;
      return setEqual(new Set(recipe.ruleIds), state.ruleIds)
        && setEqual(new Set(recipe.yesActionIds), state.yesActionIds)
        && setEqual(new Set(recipe.noActionIds), state.noActionIds);
    });
    return candidates[0];
  };

  const automationCheck = () => {
    const selfTriggerMap = {
      T01: ['A01'], T02: ['A02', 'A03'], T03: ['A02', 'A03'], T04: ['A05'],
      T05: ['A13'], T06: ['A13'], T08: ['A14'], T09: ['A01', 'A08', 'A09', 'A10', 'A11', 'A14'],
    };
    const chosenActions = new Set([...state.yesActionIds, ...state.noActionIds]);
    const risky = (selfTriggerMap[state.triggerId] || []).filter((id) => chosenActions.has(id));
    const incompatibleRules = [...state.ruleIds].filter((id) => !ruleCompatibility(state.triggerId, id).allowed);
    const revalidation = {
      qualified: ['Q-R02'], 'in-progress': ['IP-R01'], 'in-review': ['IR-R01'],
      'passed-review': ['PR-R01'], sent: ['SE-R01', 'SE-R04', 'SE-R05'], won: ['W-R01'], lost: ['L-R02'],
    }[state.stageId] || [];
    const waitIsSafe = state.waitKind !== 'days' || revalidation.some((id) => state.ruleIds.has(id));
    const checks = [
      {
        ok: Boolean(selectedTrigger()),
        label: beginnerView ? 'Start choice added' : 'Start choice added',
        detail: selectedTrigger() ? `${beginnerView ? '' : `${selectedTrigger().id} — `}${selectedTrigger().label}` : 'Choose what starts the Automation.',
      },
      {
        ok: incompatibleRules.length === 0,
        label: beginnerView ? 'Checks make sense here' : 'Rules fit Starts when',
        detail: incompatibleRules.length
          ? ruleCompatibility(state.triggerId, incompatibleRules[0]).reason
          : 'Each selected Rule adds a useful decision after the start event.',
      },
      {
        ok: state.yesActionIds.size > 0,
        label: beginnerView ? 'Action selected' : 'Action selected',
        detail: state.yesActionIds.size
          ? `${state.yesActionIds.size} Action${state.yesActionIds.size === 1 ? '' : 's'} selected for the YES path.`
          : 'Choose at least one Action for the main flow or YES path. A NO-path Action cannot complete the flow by itself.',
      },
      {
        ok: waitIsSafe,
        label: beginnerView ? (state.waitKind === 'days' ? 'Checks again after waiting' : 'Runs straight away') : 'Stage checked again after the Wait',
        detail: state.waitKind !== 'days'
          ? 'This flow runs straight away.'
          : (waitIsSafe ? 'The flow checks the latest information again after waiting.' : `After waiting, add a check such as ${revalidation.map((id) => data.rules[id]?.label || id).join(' or ')}.`),
      },
      {
        ok: risky.length === 0,
        label: beginnerView ? 'Will not keep repeating' : 'These Actions do not restart the same Automation',
        detail: risky.length ? `${risky.map((id) => data.actions[id]?.label || id).join(', ')} can change the same information that starts this flow.` : 'The chosen next steps will not start the same flow again.',
      },
    ];
    const notices = state.triggerId === 'IP-T03'
      ? [beginnerView ? 'The Deal Value check does not check Quote total, margin or discount yet.' : 'This check uses Deal Value. Quote total, margin, and discount limits need separate checks.']
      : [];
    return { checks, notices, blocking: checks.filter((item) => !item.ok) };
  };

  const selectedItemRows = (selectedIds, type, setKind = type) => {
    const source = type === 'rule' ? data.rules : data.actions;
    return [...selectedIds].map((id) => {
      const item = source[id];
      const compatibility = type === 'rule' ? ruleCompatibility(state.triggerId, id) : { allowed: true, reason: '' };
      const detail = !compatibility.allowed ? compatibility.reason : (type === 'rule' ? item.settings : item.result);
      return `<div class="qlce-selected-item ${compatibility.allowed ? '' : 'is-invalid'}"><span><strong>${beginnerView ? '' : `<span class="qlce-id">${esc(id)}</span> `}${esc(item.label)}</strong><small>${esc(detail)}</small></span><button type="button" data-remove-option-kind="${esc(setKind)}" data-remove-option-id="${esc(id)}" aria-label="Remove ${esc(item.label)}">×</button></div>`;
    }).join('');
  };

  const addOptionSelect = (items, selectedIds, kind, placeholder, disabledIds = []) => {
    const options = items.filter((item) => !selectedIds.has(item.id) && !disabledIds.includes(item.id) && item.availability !== 'withheld');
    return `<select data-add-option-kind="${esc(kind)}" aria-label="${esc(placeholder)}"><option value="">${esc(placeholder)}</option>${options.map((item) => `<option value="${esc(item.id)}">${esc(item.label)}</option>`).join('')}</select>`;
  };

  const sampleDealPreview = () => {
    if (!state.sampleTestOpen) return '';
    const hasRules = state.ruleIds.size > 0;
    const useYes = !hasRules || state.sampleTestBranch === 'yes';
    const actionIds = useYes ? state.yesActionIds : state.noActionIds;
    const actions = [...actionIds].map((id) => `${beginnerView ? '' : `${id} `}${data.actions[id].label}`);
    const trigger = selectedTrigger();
    return `<section class="qlce-sample-test" aria-live="polite">
      <div class="qlce-sample-heading"><div><small>EXAMPLE RESULT</small><h3>What would happen to this Deal?</h3></div><button type="button" data-toggle-sample-test aria-label="Close example result">×</button></div>
      ${hasRules ? `<div class="qlce-branch-toggle" role="group" aria-label="Choose sample Rule outcome"><button type="button" data-test-branch="yes" class="${useYes ? 'is-active' : ''}">Assume the checks pass</button><button type="button" data-test-branch="no" class="${!useYes ? 'is-active' : ''}">Assume the checks do not pass</button></div>` : ''}
      <ol class="qlce-sample-steps">
        <li><span>1</span><div><strong>The flow starts</strong><small>${beginnerView ? '' : `${esc(trigger.id)} — `}${esc(trigger.label)}</small></div></li>
        ${state.waitKind === 'days' ? '<li><span>2</span><div><strong>Wait</strong><small>This example skips over the waiting time.</small></div></li>' : ''}
        ${hasRules ? `<li><span>${state.waitKind === 'days' ? '3' : '2'}</span><div><strong>Check the Rule</strong><small>For this example: ${useYes ? 'Yes' : 'No'}.</small></div></li>` : ''}
        <li><span>${2 + (state.waitKind === 'days' ? 1 : 0) + (hasRules ? 1 : 0)}</span><div><strong>What WeQuote does</strong><small>${actions.length ? esc(actions.join(' + ')) : 'The flow stops here. Nothing else happens.'}</small></div></li>
      </ol>
      <p><strong>Example only:</strong> no Deal, Quote, task, or CRM activity is changed.</p>
    </section>`;
  };

  const buildPreview = () => {
    const trigger = selectedTrigger();
    const match = exactRecipeMatch();
    const check = automationCheck();
    const selectedReadiness = [
      trigger,
      ...[...state.ruleIds].map((id) => data.rules[id]),
      ...[...state.yesActionIds, ...state.noActionIds].map((id) => data.actions[id]),
    ].reduce((result, item) => {
      const rank = { live: 0, 'adapter-required': 1, 'new-runtime': 2, proposed: 3, withheld: 4 };
      return rank[item.readiness] > rank[result] ? item.readiness : result;
    }, 'live');
    const readinessKey = match?.buildReadiness || (selectedReadiness === 'proposed' ? 'contract-required' : 'phase1-build-required');
    const readiness = data.buildReadinessDefinitions[readinessKey];
    const blockers = match ? blockerList(match) : [{ id: 'phase1-deal-automation', ...data.blockerDefinitions['phase1-deal-automation'] }];
    const checkTitle = check.blocking.length === 1
      ? (beginnerView ? 'Choose one more thing' : '1 thing to fix')
      : (check.blocking.length > 1 ? `${check.blocking.length} ${beginnerView ? 'things still need choosing' : 'setup problems to fix'}` : (beginnerView ? 'This flow has the basics it needs' : 'The basic flow looks complete'));
    return `
      <article class="qlce-check-result" aria-live="polite">
        <div class="qlce-automation-check ${check.blocking.length ? 'has-errors' : 'is-clear'}">
          <div class="qlce-check-heading"><span class="qlce-check-icon">${check.blocking.length ? '!' : '✓'}</span><div><small>${beginnerView ? 'AUTOMATION CHECK' : 'AUTOMATION CHECK'}</small><h2>${esc(checkTitle)}</h2><p>${beginnerView ? 'This only checks the choices on this page. Nothing is saved or run.' : 'This checks that you chose what starts the Automation and at least one Action. It also checks any Wait or Rule.'}</p></div></div>
          <div class="qlce-check-list">${check.checks.map((item) => `<div class="${item.ok ? 'is-pass' : 'is-fail'}"><span>${item.ok ? '✓' : '!'}</span><p><strong>${esc(item.label)}</strong><small>${esc(item.detail)}</small></p></div>`).join('')}</div>
          ${check.notices.map((notice) => `<div class="qlce-check-notice"><strong>${beginnerView ? 'One limit to know' : 'This choice is not available yet'}</strong><span>${esc(notice)}</span></div>`).join('')}
          ${beginnerView ? '' : '<p class="qlce-activation-note">This only checks the flow on this page. It does not mean the feature has been built or is ready to turn on.</p>'}
        </div>
        <div class="qlce-actions-row qlce-check-actions">
          <button type="button" class="qlce-primary" data-toggle-sample-test ${check.blocking.length ? 'disabled' : ''}>${state.sampleTestOpen ? 'Close example result' : 'Show an example result'}</button>
          <button type="button" data-copy="build" ${check.blocking.length ? 'disabled' : ''}>${icon('copy')} Copy flow</button>
        </div>
        ${sampleDealPreview()}
        ${beginnerView ? '' : `<details class="qlce-readiness-details"><summary>Is this available now?</summary>
          <div class="qlce-result-status">${statusPill(match ? `Matches an example in this guide` : 'New example', match ? 'candidate' : 'exploratory')}${statusPill(readiness.label, readinessKey)}</div>
          ${match ? `<p class="qlce-match-reason"><strong>${esc(match.title)}:</strong> ${esc(match.reason)}</p>` : '<p class="qlce-match-reason">You made a new combination. It is not one of the examples in this guide.</p>'}
          <div class="qlce-blocker-summary"><strong>Why it is not available yet</strong><span>${blockers.map((item) => esc(item.label)).join(' · ')}</span></div>
        </details>`}
      </article>`;
  };

  const pricingChooser = () => state.triggerId === 'IP-T03' ? `
    <fieldset class="qlce-pricing-chooser"><legend>Type of price change</legend>
      ${data.pricingFilters.map((item) => `<label class="qlce-price-option ${state.pricingFilter === item.id ? 'is-active' : ''}">
        <input type="radio" name="pricing-filter" value="${esc(item.id)}" ${state.pricingFilter === item.id ? 'checked' : ''}>
        <span><strong>${esc(item.label)}</strong><small>${esc(item.detail)}</small><em>${esc(item.status)}</em></span>
      </label>`).join('')}
    </fieldset>` : '';

  const buildMode = () => {
    const current = context();
    const triggerItems = current.selectableTriggerIds.map((id) => data.triggers[id]);
    const ruleItems = [...current.selectableRuleIds, ...current.disabledRuleIds].map((id) => data.rules[id]);
    const incompatibleRuleIds = current.selectableRuleIds.filter((id) => !ruleCompatibility(state.triggerId, id).allowed);
    const unavailableRuleIds = [...new Set([...current.disabledRuleIds, ...incompatibleRuleIds])];
    const actionItems = [...current.actionIds.map((id) => data.actions[id]), ...quoteActionsForContext(current.id).filter((item) => item.availability === 'selectable')];
    const ruleSummary = state.ruleIds.size
      ? `${state.ruleIds.size} check${state.ruleIds.size === 1 ? '' : 's'} · ${state.ruleJoin === 'or' ? 'any one can pass' : 'all must pass'}`
      : (beginnerView ? 'No Rule — always continue' : 'No Rule — always continue');
    const yesSummary = state.yesActionIds.size
      ? `${state.yesActionIds.size} Action${state.yesActionIds.size === 1 ? '' : 's'} selected`
      : (beginnerView ? 'Nothing chosen yet' : 'Nothing chosen yet');
    const noSummary = state.noActionIds.size
      ? `${state.noActionIds.size} Action${state.noActionIds.size === 1 ? '' : 's'} selected`
      : 'Stop here';
    return `
      <section class="qlce-mode-panel qlce-build-layout" role="tabpanel">
        <div class="qlce-builder-controls">
          <div class="qlce-builder-heading"><span>${beginnerView ? 'TRY AN EXAMPLE' : 'PRACTICE BUILDER'}</span><h2>${beginnerView ? 'Build a simple flow' : 'Put a flow together'}</h2><p>Choose what starts the Automation, add a Rule only when you need a Yes or No check, then choose what WeQuote should do. Nothing is saved or turned on.</p></div>

          <div class="qlce-guided-stack">
            <section class="qlce-guided-step">
              <div class="qlce-guided-step-heading"><span>1</span><div><h3>${beginnerView ? 'When should it start?' : 'When should it start?'}</h3><p>${beginnerView ? 'Choose the Stage. Then choose the change that should start the Automation. Add a Wait only if it must run later.' : 'Choose the Stage. Then choose the change that should start the Automation. Add a Wait only if it must run later.'}</p></div></div>
              <div class="qlce-select-grid">
                <label><span>Quote context</span><select data-build-stage>${data.contexts.map((item) => `<option value="${esc(item.id)}" ${item.id === state.stageId ? 'selected' : ''}>${esc(item.label)}</option>`).join('')}</select></label>
                <label><span>Starts when</span><select data-build-trigger>${triggerItems.map((item) => `<option value="${esc(item.id)}" ${item.id === state.triggerId ? 'selected' : ''}>${beginnerView ? '' : `${esc(item.id)} — `}${esc(item.label)}</option>`).join('')}</select></label>
                <label><span>Continue straight away or wait?</span><select data-build-wait><option value="none" ${state.waitKind === 'none' ? 'selected' : ''}>Continue straight away</option><option value="days" ${state.waitKind === 'days' ? 'selected' : ''}>Wait for a set number of days</option></select></label>
              </div>
              ${state.triggerId === 'IP-T03' ? `<label class="qlce-guided-select"><span>Type of price change</span><select data-build-pricing>${data.pricingFilters.map((item) => `<option value="${esc(item.id)}" ${state.pricingFilter === item.id ? 'selected' : ''}>${esc(item.label)}</option>`).join('')}</select><small>${esc(data.pricingFilters.find((item) => item.id === state.pricingFilter)?.detail || '')}</small></label>` : ''}
            </section>

            <section class="qlce-guided-step">
              <div class="qlce-guided-step-heading"><span>2</span><div><h3>${beginnerView ? 'Add a Rule (optional)' : 'Add a Rule (optional)'} <em>Optional</em></h3><p>${esc(ruleSummary)}</p></div></div>
              <div class="qlce-check-notice"><strong>Make the Rule add a new decision</strong><span>Do not ask the opposite of something Starts when has already confirmed. For example, after “Expected Close Date is getting close”, check whether the Deal has a Next Action — not whether the Expected Close Date is missing. Add a Wait first only when you genuinely need to check the same state again later.</span></div>
              ${state.ruleIds.size ? `<div class="qlce-selected-list">${selectedItemRows(state.ruleIds, 'rule')}</div>` : `<div class="qlce-guided-empty">${beginnerView ? 'A Rule is a check. If you do not add one, the Automation always continues to Actions.' : 'A Rule is a check. If you do not add one, the Automation always continues to Actions.'}</div>`}
              <div class="qlce-guided-add">${addOptionSelect(ruleItems, state.ruleIds, 'rule', beginnerView ? 'Choose a Rule (optional)…' : 'Choose a Rule (optional)…', unavailableRuleIds)}</div>
              ${state.ruleIds.size > 1 ? `<label class="qlce-rule-join"><span>If you add more than one Rule</span><select data-build-rule-join><option value="and" ${state.ruleJoin === 'and' ? 'selected' : ''}>All selected Rules must pass (AND)</option><option value="or" ${state.ruleJoin === 'or' ? 'selected' : ''}>Any one selected Rule can pass (OR)</option></select></label>` : ''}
            </section>

            <section class="qlce-guided-step">
              <div class="qlce-guided-step-heading"><span>3</span><div><h3>${beginnerView ? 'Choose what WeQuote should do' : 'Choose what WeQuote should do'}</h3><p>${esc(yesSummary)}</p></div></div>
              ${state.yesActionIds.size ? `<div class="qlce-selected-list">${selectedItemRows(state.yesActionIds, 'action', 'yes-action')}</div>` : `<div class="qlce-guided-empty is-required">${beginnerView ? 'Choose at least one Action.' : 'Choose at least one Action.'}</div>`}
              <div class="qlce-guided-add">${addOptionSelect(actionItems, state.yesActionIds, 'yes-action', beginnerView ? 'Choose an Action…' : 'Choose an Action…')}</div>
              ${quoteActionMatrixNote(quoteActionsForContext(current.id))}
            </section>

            ${state.ruleIds.size ? `<section class="qlce-guided-step qlce-otherwise-step">
              <div class="qlce-guided-step-heading"><span>4</span><div><h3>${beginnerView ? 'If No' : 'If No'}</h3><p>${esc(noSummary)}</p></div><button type="button" data-toggle-no-path>${state.noPathOpen || state.noActionIds.size ? 'Hide options' : 'Choose what happens if No'}</button></div>
              ${state.noPathOpen || state.noActionIds.size ? `<div class="qlce-optional-path"><p>If the Rule is No, the safest choice is Stop. Add an Action only when something must happen for No.</p>${state.noActionIds.size ? `<div class="qlce-selected-list">${selectedItemRows(state.noActionIds, 'action', 'no-action')}</div>` : ''}<div class="qlce-guided-add">${addOptionSelect(actionItems, state.noActionIds, 'no-action', 'Choose an Action (optional)…')}</div></div>` : ''}
            </section>` : ''}
          </div>

          ${beginnerView ? '' : `<section class="qlce-advanced-disclosure ${state.advancedOpen ? 'is-open' : ''}">
            <button type="button" class="qlce-advanced-toggle" data-toggle-advanced aria-expanded="${state.advancedOpen}"><span><strong>Show all choices</strong><small>See every check and action in one list</small></span><b>${state.advancedOpen ? '−' : '+'}</b></button>
            ${state.advancedOpen ? `<div class="qlce-advanced-body"><p>Use this view if you prefer choosing from complete lists. The guided steps above are easier for most people.</p>${pricingChooser()}<div class="qlce-choice-grid">
              <fieldset><legend>Rule (optional)</legend><p class="qlce-field-help">Add a Rule only when WeQuote must check something before it acts.</p><label class="qlce-rule-join"><span>If you add more than one Rule</span><select data-build-rule-join><option value="and" ${state.ruleJoin === 'and' ? 'selected' : ''}>All Rules must pass (AND)</option><option value="or" ${state.ruleJoin === 'or' ? 'selected' : ''}>Any Rule can pass (OR)</option></select></label><div class="qlce-option-scroll">${optionList(ruleItems, state.ruleIds, 'rule', unavailableRuleIds)}</div></fieldset>
              <fieldset><legend>If Yes — Actions</legend><p class="qlce-field-help">Choose what happens when the Rule is Yes.</p><div class="qlce-option-scroll">${optionList(actionItems, state.yesActionIds, 'yes-action')}</div></fieldset>
              <fieldset><legend>If No — Actions or Stop</legend><p class="qlce-field-help">Choose what happens when the Rule is No, or leave this empty to Stop.</p><div class="qlce-option-scroll">${optionList(actionItems, state.noActionIds, 'no-action')}</div></fieldset>
            </div></div>` : ''}
          </section>`}
          <div class="qlce-actions-row qlce-reset-row"><button type="button" data-reset-build>${icon('reset')} Start again</button></div>
        </div>
        <aside class="qlce-builder-result">
          ${buildPreview()}
        </aside>
      </section>`;
  };

  const coverageFor = (type, id) => {
    if (type === 'actions') return data.actionCoverage[id] || [];
    const key = type === 'triggers' ? 'triggerIds' : 'ruleIds';
    return data.recipes.filter((recipe) => recipe[key].includes(id)).map((recipe) => recipe.id);
  };

  const ruleFlowControls = [
    { id: 'flow-rule', label: 'Rule', detail: 'Check one or more Deal or Quote conditions. Adding a Rule creates Yes and No paths.' },
    { id: 'flow-and-or', label: 'AND / OR group', detail: 'Choose whether every check or any one check must match.' },
    { id: 'flow-wait', label: 'Wait', detail: 'Pause for calendar days, working days, or a chosen date and time.' },
    { id: 'flow-end', label: 'Stop branch', detail: 'Stop this path safely without running another Action.' },
  ];

  const plainUnavailableReason = {
    'IP-T04': 'WeQuote does not yet have agreed fields that show when the work included in a Quote has changed.',
    'IP-R02': 'The team has not agreed exactly which price changes count yet.',
    'IP-R04': 'The team has not agreed which Quote fields show that the work has changed.',
    'PR-R02': 'The team has not agreed which customer-facing changes require another review.',
    'W-R02': 'There is no agreed field that says whether a deposit is required.',
    'W-R03': 'There is no agreed handover checklist yet.',
  };

  const catalogueGroups = () => {
    const current = context();
    if (state.catalogueType === 'triggers') return [
      { label: `Only for ${current.label}`, tag: 'This Quote context', items: current.triggerIds.map((id) => data.triggers[id]) },
      { label: 'Also available in every Quote context', tag: 'Every Quote context', items: current.selectableTriggerIds.filter((id) => /^T\d{2}$/.test(id)).map((id) => data.triggers[id]) },
      { label: 'Not available yet', tag: 'Not available yet', items: current.disabledTriggerIds.map((id) => data.triggers[id]) },
    ];
    if (state.catalogueType === 'actions') return [
      { label: 'Shared CRM Actions', tag: 'Every Quote context', items: current.actionIds.map((id) => data.actions[id]) },
      { label: 'Quote-specific Actions for this lifecycle segment', tag: 'This Quote context', items: quoteActionsForContext(current.id) },
    ];
    return [
      { label: 'Build the flow', tag: 'Build the flow', items: ruleFlowControls },
      { label: `Checks only for ${current.label}`, tag: 'This Quote context', items: current.ruleIds.map((id) => data.rules[id]) },
      { label: 'Checks for every Quote context', tag: 'Every Quote context', items: current.selectableRuleIds.filter((id) => /^R\d{2}$/.test(id)).map((id) => data.rules[id]) },
      { label: 'Not available yet', tag: 'Not available yet', items: current.disabledRuleIds.map((id) => data.rules[id]) },
    ];
  };

  const catalogueHelp = () => ({
    triggers: 'Choose the change or date that starts the Automation.',
    actions: 'Shared Deal Actions are available in every Quote context. Extra Quote Actions appear only where they are allowed.',
    rules: 'The Rule tab contains Rule, AND / OR group, Wait and Stop branch. Adding a Rule creates the Yes and No paths automatically.',
  }[state.catalogueType]);

  const catalogueItemDetail = (item) => {
    if (item.detail) return item.detail;
    if (state.catalogueType === 'triggers') return item.firesWhen;
    if (state.catalogueType === 'actions') return item.result;
    return item.settings || item.evaluation;
  };

  const catalogueMode = () => {
    const term = state.search.trim().toLowerCase();
    const current = context();
    const groups = catalogueGroups().map((group) => ({
      ...group,
      items: group.items.filter((item) => `${item.id} ${item.label} ${catalogueItemDetail(item)}`.toLowerCase().includes(term)),
    })).filter((group) => group.items.length);
    return `
      <section class="qlce-mode-panel" role="tabpanel">
        <div class="qlce-scope-note"><strong>${beginnerView ? 'How this guide works' : 'About this guide'}</strong><span>The 12 Templates are fixed, ready-made flows. “Reviewed examples” is a separate idea library, not the Template inventory. Custom lets you choose only the Starts when, Rules and Actions allowed in the selected Quote context.</span></div>
        <div class="qlce-catalogue-heading"><div><span>OPTIONS FOR THIS QUOTE CONTEXT</span><h2>${esc(current.label)} choices</h2><p>${esc(catalogueHelp())}</p></div>
          <div class="qlce-type-tabs" role="tablist" aria-label="Block Library">${[['triggers','Starts when'],['actions','Actions'],['rules','Rules']].map(([id,label]) => `<button type="button" role="tab" aria-selected="${state.catalogueType === id}" data-catalogue-type="${id}" class="${state.catalogueType === id ? 'is-active' : ''}">${label}</button>`).join('')}</div>
        </div>
        ${state.catalogueType === 'rules' ? `<div class="qlce-branch-note"><strong>${beginnerView ? 'After you add a Rule' : 'After you add a Rule'}</strong><span>${beginnerView ? 'If the check passes, WeQuote follows Yes. If it does not, WeQuote follows No.' : 'WeQuote shows what happens for If Yes and If No.'}</span></div>` : ''}
        <div class="qlce-block-groups">${groups.map((group) => `<section class="qlce-block-group"><div class="qlce-block-group-heading"><h3>${esc(group.label)}</h3><span>${group.items.length}</span></div><div class="qlce-catalogue-grid">${group.items.map((item) => {
          const unavailable = item.availability === 'withheld';
          return `<article class="qlce-catalogue-card ${unavailable ? 'is-withheld' : ''}">
            <div><span class="qlce-block-kind">${esc(group.tag)}</span>${unavailable ? `<span class="qlce-lock">${icon('lock')}</span>` : ''}</div>
            <h3>${esc(item.label)}</h3>
            <p>${esc(catalogueItemDetail(item))}</p>
            ${unavailable ? `<footer><strong>Why you cannot choose this yet</strong><small>${esc(item.unavailableReason || plainUnavailableReason[item.id] || 'WeQuote cannot check this reliably yet.')}</small></footer>` : ''}
          </article>`;
        }).join('')}</div></section>`).join('') || '<p class="qlce-muted">No choice matches your search.</p>'}</div>
        ${state.catalogueType === 'actions' ? `<div class="qlce-protected"><h3>WeQuote controls these changes (they are not Actions)</h3><ul>${data.protectedCapabilities.map((item) => `<li>${icon('lock')} ${esc(item)}</li>`).join('')}</ul></div>` : ''}
      </section>`;
  };

  const customStageBlockItems = function quoteGuideCustomStageBlockItems() {
  const guide = data.customStageGuide;
  if (!guide) return [];
  const isQuote = state.customStageKind === 'quote';
  const placement = guide.quote.placements.find((item) => item.id === state.customPlacementId) || guide.quote.placements[0];
  if (state.customBlockType === 'triggers') {
    return [
      { id: 'custom-stage-entry', label: guide.shared.entryTrigger.label, detail: guide.shared.entryTrigger.detail, settings: 'Choose the named Custom Stage.', scopeLabel: 'Custom Stage' },
      ...guide.shared.triggerIds.map((id) => ({ id, label: data.triggers[id].label, detail: data.triggers[id].firesWhen, settings: data.triggers[id].settings, scopeLabel: 'Shared CRM' })),
      ...(isQuote ? (placement.triggerIds || []).map((id) => ({ id, label: data.triggers[id].label, detail: data.triggers[id].firesWhen, settings: data.triggers[id].settings, scopeLabel: 'Quote segment' })) : []),
    ];
  }
  if (state.customBlockType === 'rules') {
    return [
      ...guide.shared.ruleIds.map((id) => ({ id, label: data.rules[id].label, detail: data.rules[id].settings, settings: data.rules[id].evaluation, scopeLabel: 'Shared CRM' })),
      ...(isQuote ? (placement.ruleIds || []).map((id) => ({ id, label: data.rules[id].label, detail: data.rules[id].settings, settings: data.rules[id].evaluation, scopeLabel: 'Quote segment' })) : []),
    ];
  }
  if (state.customBlockType === 'actions') {
    return [
      ...guide.shared.actionIds.filter((id) => data.actions[id]?.availability !== 'withheld').map((id) => ({ id, label: data.actions[id].label, detail: data.actions[id].result, settings: data.actions[id].settings, scopeLabel: 'Shared CRM' })),
      ...(isQuote ? quoteActionsForPlacement(placement.id).filter((item) => item.availability === 'selectable').map((item) => ({ ...item, detail: item.result })) : []),
    ];
  }
  return [];
};

  const customStageCardNote = function quoteGuideCustomStageCardNote(item) {
  if (item.guardrails?.length) return item.guardrails.join(' ');
  if (item.id === 'A09') return 'Only remove a Label that is managed by Automation. Do not remove a Label that a user added by hand.';
  if (item.id === 'A10' || item.id === 'A11') return 'Use only when structured information confirms the customer Interest. Text in a Note is not enough.';
  return '';
};

  const customStageMode = () => {
    const guide = data.customStageGuide;
    if (!guide) return '';
    const isQuote = state.customStageKind === 'quote';
    const stageName = (isQuote ? state.quoteCustomStageName : state.standaloneCustomStageName).trim()
      || (isQuote ? 'Custom Stage' : guide.standalone.defaultStageName);
    const placement = guide.quote.placements.find((item) => item.id === state.customPlacementId)
      || guide.quote.placements[0];
    const constant = isQuote ? guide.quote : guide.standalone;
    const movement = isQuote ? guide.movement.quote : guide.movement.standalone;
    const blockItems = customStageBlockItems();
    const typeLabel = guide.tabs[state.customBlockType] || '';
    const startsCount = guide.shared.triggerIds.length;
    const quoteActionMatrix = isQuote ? quoteActionsForPlacement(placement.id) : [];
    const quoteActionCount = quoteActionMatrix.filter((item) => item.availability === 'selectable').length;
    const stageMatrix = isQuote ? '<section class="qlce-quote-stage-matrix"><div><span>CREATE QUOTE BY STAGE</span><h2>When each Create Quote Action is available</h2></div><div>' + guide.quote.stageActionMatrix.map((row) => '<article><strong>' + esc(row.context) + '</strong><small>' + esc(row.customSegment) + '</small><b>' + esc(row.available) + '</b><p>' + esc(row.boundary) + '</p></article>').join('') + '</div></section>' : '';

    const kindButtons = Object.entries(guide.kinds).map(([id, item]) =>
      '<button type="button" class="qlce-custom-kind ' + (state.customStageKind === id ? 'is-active' : '') + '" data-custom-kind="' + esc(id) + '" aria-pressed="' + (state.customStageKind === id) + '">' +
        '<strong>' + esc(item.label) + '</strong><span>' + esc(item.help) + '</span>' +
      '</button>'
    ).join('');

    const placementButtons = guide.quote.placements.map((item, index) =>
      '<button type="button" class="qlce-placement ' + (placement.id === item.id ? 'is-active' : '') + '" data-custom-placement="' + esc(item.id) + '" aria-pressed="' + (placement.id === item.id) + '">' +
        '<span>' + String(index + 1).padStart(2, '0') + '</span><strong>' + esc(item.shortLabel) + '</strong><small>' + esc(item.label) + '</small>' +
      '</button>'
    ).join('');

    const typeTabs = Object.entries(guide.tabs).map(([id, label]) =>
      '<button type="button" role="tab" aria-selected="' + (state.customBlockType === id) + '" class="' + (state.customBlockType === id ? 'is-active' : '') + '" data-custom-block-type="' + esc(id) + '">' + esc(label) + '</button>'
    ).join('');

    const blockCards = blockItems.map((item) => {
      const note = customStageCardNote(item);
      return '<article class="qlce-custom-block-card ' + (item.availability === 'withheld' ? 'is-withheld' : '') + '">' +
        '<div><span class="qlce-block-kind">' + esc(typeLabel + (item.scopeLabel ? ' · ' + item.scopeLabel : '')) + '</span></div>' +
        '<h3>' + esc(item.label) + '</h3>' +
        '<p>' + esc(item.detail) + '</p>' +
        '<small><strong>What you choose:</strong> ' + esc(item.settings) + '</small>' +
        (note ? '<aside>' + esc(note) + '</aside>' : '') +
      '</article>';
    }).join('');

    const quoteContext = '<div class="qlce-custom-context">' +
      '<div><span>CURRENT CONTEXT</span><h3>' + esc(stageName) + '</h3><p>' + esc(placement.context) + '</p><small>' + esc(placement.example) + '</small></div>' +
      '<div><span>NEXT WEQUOTE-MANAGED EVENT</span><p>' + esc(placement.nextEvent) + '</p></div>' +
    '</div>';

    const standaloneContext = '<div class="qlce-custom-context">' +
      '<div><span>YOUR WORKING STAGE</span><h3>' + esc(stageName) + '</h3><p>' + esc(guide.standalone.changesBody) + '</p></div>' +
      '<div><span>SUGGESTED STARTING POINT</span><div class="qlce-stage-seed">' +
        guide.standalone.recommendedStages.map((item) => '<b>' + esc(item) + '</b>').join('<i>→</i>') +
        '<i>→</i><b class="is-protected">' + esc(guide.standalone.protectedResults.join(' / ')) + '</b>' +
      '</div><small>You can rename or add normal working Stages. Won and Lost stay protected results.</small></div>' +
    '</div>';

    const movementPanel = '<div class="qlce-movement-panel">' +
      '<span>STAGE MOVEMENT</span><h3>' + esc(movement.heading) + '</h3><p>' + esc(movement.body) + '</p>' +
      '<div><strong>Needs a separate decision</strong><span>' + esc(movement.decision) + '</span></div>' +
    '</div>';

    return '<section class="qlce-mode-panel qlce-custom-stage-mode" role="tabpanel">' +
      '<div class="qlce-custom-hero"><span>' + esc(guide.kicker) + '</span><h2>' + esc(guide.heading) + '</h2><p>' + esc(guide.intro) + '</p></div>' +
      '<div class="qlce-custom-kind-grid" role="group" aria-label="Choose a Pipeline type">' + kindButtons + '</div>' +
      '<div class="qlce-custom-controls">' +
        '<label><span>Stage name</span><input type="text" value="' + esc(isQuote ? state.quoteCustomStageName : state.standaloneCustomStageName) + '" data-custom-stage-name="' + (isQuote ? 'quote' : 'standalone') + '" placeholder="Enter a Stage name"></label>' +
        '<div><span>Where does it belong?</span><strong>' + esc(isQuote ? placement.label : 'Inside your Standalone Pipeline') + '</strong></div>' +
      '</div>' +
      (isQuote ? '<div class="qlce-placement-list" role="group" aria-label="Choose where the Custom Stage sits">' + placementButtons + '</div>' : '') +
      '<div class="qlce-same-different">' +
        '<article class="is-same"><span>✓</span><div><strong>' + esc(constant.constantTitle) + '</strong><p>' + esc(constant.constantBody) + '</p></div></article>' +
        '<article class="is-different"><span>↔</span><div><strong>' + esc(constant.changesTitle) + '</strong><p>' + esc(constant.changesBody) + '</p></div></article>' +
      '</div>' +
      '<div class="qlce-custom-metrics" aria-label="Shared Block counts">' +
        '<div><strong>' + startsCount + '</strong><span>Ways to start at every Stage</span></div>' +
        '<div><strong>' + guide.shared.ruleIds.length + '</strong><span>Rules at every Stage</span></div>' +
        '<div><strong>' + guide.shared.actionIds.filter((id) => data.actions[id]?.availability !== 'withheld').length + '</strong><span>Available Actions at every Stage</span></div>' +
        '<div><strong>' + quoteActionCount + '</strong><span>Extra Quote Actions here</span></div>' +
      '</div>' +
      (isQuote ? quoteContext : standaloneContext) +
      '<div class="qlce-custom-library-heading"><div><span>WHAT THIS STAGE CAN USE</span><h2>' + esc(stageName) + '</h2></div><div class="qlce-type-tabs" role="tablist" aria-label="Custom Stage Block Library">' + typeTabs + '</div></div>' +
      (state.customBlockType === 'movement' ? movementPanel : '<div class="qlce-custom-block-grid">' + blockCards + '</div>') +
      '<div class="qlce-custom-warnings">' +
        (isQuote
          ? '<p><strong>When Create Quote is available.</strong> ' + esc(guide.quote.actionPolicy) + '</p><p><strong>Stages WeQuote controls.</strong> ' + esc(guide.quote.protectedWarning) + '</p>' + quoteActionMatrixNote(quoteActionMatrix, 'Quote Actions allowed here')
          : '<p><strong>No Quote-controlled movement.</strong> ' + esc(guide.standalone.quoteWarning) + '</p><p><strong>Moving between Stages.</strong> ' + esc(guide.standalone.movement) + '</p>') +
      '</div>' +
      stageMatrix +
    '</section>';
  };

  const render = () => {
    const customModeActive = state.mode === 'custom-stages' && Boolean(data.customStageGuide);
    root.innerHTML = `
      <header class="qlce-header">
        <div class="qlce-header-main"><div><span class="qlce-kicker">Product guideline · 29 August 2026</span><h1>Quote Lifecycle<br>Automation Guide</h1><p>For each Quote Stage, choose a ready-made Template or build your own Automation. In Custom, choose what starts it, add a Rule only if you need a check, then choose what WeQuote should do.</p></div>
          <div class="qlce-source-card"><strong>${esc(data.source.reviewVerdict)}</strong><span>${esc(data.source.reviewCoverage)}</span><small>Source ${esc(data.source.sha256.slice(0, 12))}…</small></div>
        </div>
        <div class="qlce-disclaimer"><strong>Interactive guide.</strong> You can try different choices here. Nothing is saved or turned on.</div>
        <section class="qlce-language-guide" aria-labelledby="qlceLanguageGuideTitle"><div><span>HOW TO READ A FLOW</span><h2 id="qlceLanguageGuideTitle">Five simple parts</h2></div><div><article><strong>Starts when</strong><span>The change or date that begins the Automation.</span></article><article><strong>Wait (optional)</strong><span>Pause before the next step.</span></article><article><strong>Rule (optional check)</strong><span>A Yes or No question that WeQuote checks at that point.</span></article><article><strong>If Yes / If No</strong><span>What WeQuote does after the Rule answers Yes or No.</span></article><article><strong>Action</strong><span>Something WeQuote does, such as create a Note or set the Next Action.</span></article></div></section>
        ${data.customStageGuide ? `<div class="qlce-creation-routes">${Object.values(data.customStageGuide.creationRoutes).map((route) => `<article><strong>${esc(route.label)}</strong><span>${esc(route.detail)}</span></article>`).join('')}</div>` : ''}
        <div class="qlce-toolbar">${modeNav()}${(state.mode === 'build' && beginnerView) || customModeActive ? '' : `<label class="qlce-search"><span>Search</span><input type="search" value="${esc(state.search)}" placeholder="${state.mode === 'catalogue' ? 'Search these choices' : (beginnerView ? 'Search example flows' : 'Search examples, checks, or actions')}" data-search></label>`}<button type="button" data-print>Print</button></div>
        ${customModeActive ? '' : stageNav()}
      </header>
      <main>${state.mode === 'recipes' ? recipesMode() : state.mode === 'build' ? buildMode() : state.mode === 'custom-stages' ? customStageMode() : catalogueMode()}</main>
      <footer class="qlce-footer">${customModeActive ? '<span>Choose a Pipeline type and placement to see exactly what stays the same and what changes.</span><span>Interactive product guide — nothing is saved or run.</span>' : beginnerView ? '<span>Choose a Stage to see when a flow can start, what it can check, and what it can do.</span><span>How this guide works only — nothing is saved or run.</span>' : `<span>${data.counts.contexts} Stages · ${data.counts.triggersDefined} ways to start · ${data.counts.rulesDefined} Rules · ${data.counts.actions} Actions</span><span>${data.counts.recipeCandidates} examples · ${data.counts.recipesLiveReady} ready to run · ${data.counts.recipesWithheld} choices not available yet</span>`}</footer>`;
  };

  const copyText = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
  };

  const buildText = () => {
    const trigger = selectedTrigger();
    const pricing = state.triggerId === 'IP-T03' ? data.pricingFilters.find((item) => item.id === state.pricingFilter) : null;
    if (beginnerView) return [
      `STAGE: ${context().label}`,
      `WHEN: ${trigger.label}${pricing ? ` — ${pricing.label}` : ''}`,
      `WAIT: ${state.waitKind === 'days' ? 'Set number of days' : 'No wait'}`,
      `CHECK FIRST: ${[...state.ruleIds].map((id) => data.rules[id]?.label || id).join(` ${ruleJoinLabel()} `) || 'No extra check'}`,
      `THEN DO: ${[...state.yesActionIds].map((id) => data.actions[id]?.label || id).join(' + ') || 'Stop'}`,
      `IF NOT: ${[...state.noActionIds].map((id) => data.actions[id]?.label || id).join(' + ') || 'Stop'}`,
    ].join('\n');
    return [
      `STAGE ${context().label}`,
      `STARTS WHEN ${trigger.label}${pricing ? ` — ${pricing.label}` : ''}`,
      `WAIT ${state.waitKind === 'days' ? 'Set number of whole days' : 'No wait'}`,
      `RULE (OPTIONAL) ${[...state.ruleIds].map((id) => data.rules[id].label).join(` ${ruleJoinLabel()} `) || 'No Rule'}`,
      `YES — ACTIONS ${[...state.yesActionIds].map((id) => data.actions[id].label).join(' + ') || 'Stop'}`,
      `NO — ACTIONS / END ${[...state.noActionIds].map((id) => data.actions[id].label).join(' + ') || 'Stop'}`,
      exactRecipeMatch() ? `MATCHES EXAMPLE AN EXAMPLE IN THIS GUIDE` : 'EXAMPLE New example',
    ].join('\n');
  };

  root.addEventListener('click', async (event) => {
    const target = event.target.closest('button');
    if (!target) return;
    if (target.dataset.mode) state.mode = target.dataset.mode;
    if (target.dataset.customKind) state.customStageKind = target.dataset.customKind;
    if (target.dataset.customPlacement) state.customPlacementId = target.dataset.customPlacement;
    if (target.dataset.customBlockType) state.customBlockType = target.dataset.customBlockType;
    if (target.dataset.stage) {
      state.stageId = target.dataset.stage;
      state.triggerId = context().primaryTriggerId;
      state.recipeId = '';
      state.ruleJoin = 'and';
      state.ruleIds.clear(); state.yesActionIds.clear(); state.noActionIds.clear();
      state.noPathOpen = false; state.sampleTestOpen = false;
    }
    if (target.dataset.trigger) {
      const trigger = data.triggers[target.dataset.trigger];
      if (trigger.availability === 'withheld') return;
      state.triggerId = target.dataset.trigger;
      state.recipeId = '';
    }
    if (target.dataset.recipe) state.recipeId = target.dataset.recipe;
    if (target.dataset.loadRecipe) {
      const recipe = recipeById(target.dataset.loadRecipe);
      if (recipe?.status !== 'candidate') return;
      if (recipe.contextId !== 'shared') state.stageId = recipe.contextId;
      state.triggerId = recipe.triggerIds[0];
      state.recipeId = recipe.id;
      state.waitKind = waitKind(recipe.wait);
      state.ruleJoin = recipeRuleJoin(recipe);
      state.ruleIds = new Set(recipe.ruleIds);
      state.yesActionIds = new Set(recipe.yesActionIds);
      state.noActionIds = new Set(recipe.noActionIds);
      state.noPathOpen = state.noActionIds.size > 0;
      state.sampleTestOpen = false;
      state.mode = 'build';
    }
    if (target.dataset.catalogueType) state.catalogueType = target.dataset.catalogueType;
    if (target.hasAttribute('data-toggle-no-path')) state.noPathOpen = !state.noPathOpen;
    if (target.hasAttribute('data-toggle-advanced')) state.advancedOpen = !state.advancedOpen;
    if (target.hasAttribute('data-toggle-sample-test')) state.sampleTestOpen = !state.sampleTestOpen;
    if (target.dataset.testBranch) state.sampleTestBranch = target.dataset.testBranch;
    if (target.dataset.removeOptionKind) {
      const sets = { rule: state.ruleIds, 'yes-action': state.yesActionIds, 'no-action': state.noActionIds };
      sets[target.dataset.removeOptionKind]?.delete(target.dataset.removeOptionId);
      if (!state.yesActionIds.size && !state.noActionIds.size) state.sampleTestOpen = false;
    }
    if (target.hasAttribute('data-reset-build')) {
      state.waitKind = 'none'; state.pricingFilter = 'any'; state.ruleJoin = 'and';
      state.ruleIds.clear(); state.yesActionIds.clear(); state.noActionIds.clear();
      state.noPathOpen = false; state.advancedOpen = false; state.sampleTestOpen = false; state.sampleTestBranch = 'yes';
    }
    if (target.dataset.copy === 'scenario') await copyText(scenarioText(recipeById(target.dataset.copyId)));
    if (target.dataset.copy === 'build') await copyText(buildText());
    if (target.hasAttribute('data-print')) window.print();
    render();
  });

  root.addEventListener('input', (event) => {
    const customNameKind = event.target.dataset.customStageName;
    if (customNameKind) {
      if (customNameKind === 'quote') state.quoteCustomStageName = event.target.value;
      if (customNameKind === 'standalone') state.standaloneCustomStageName = event.target.value;
      const selectionStart = event.target.selectionStart;
      render();
      const input = root.querySelector('[data-custom-stage-name="' + customNameKind + '"]');
      input?.focus();
      input?.setSelectionRange(selectionStart, selectionStart);
      return;
    }
    if (!event.target.matches('[data-search]')) return;
    state.search = event.target.value;
    const selectionStart = event.target.selectionStart;
    render();
    const input = root.querySelector('[data-search]');
    input?.focus();
    input?.setSelectionRange(selectionStart, selectionStart);
  });

  root.addEventListener('change', (event) => {
    const target = event.target;
    if (target.matches('[data-build-stage]')) {
      state.stageId = target.value;
      state.triggerId = context().primaryTriggerId;
      state.recipeId = '';
      state.ruleJoin = 'and';
      state.ruleIds.clear(); state.yesActionIds.clear(); state.noActionIds.clear();
      state.noPathOpen = false; state.sampleTestOpen = false;
    }
    if (target.matches('[data-build-trigger]')) {
      state.triggerId = target.value;
      state.recipeId = '';
      state.ruleJoin = 'and';
      state.ruleIds.clear(); state.yesActionIds.clear(); state.noActionIds.clear();
      state.noPathOpen = false; state.sampleTestOpen = false;
    }
    if (target.matches('[data-build-wait]')) state.waitKind = target.value;
    if (target.matches('[data-build-rule-join]')) state.ruleJoin = target.value;
    if (target.matches('[data-build-pricing]')) state.pricingFilter = target.value;
    if (target.matches('input[name="pricing-filter"]')) state.pricingFilter = target.value;
    if (target.dataset.addOptionKind && target.value) {
      const sets = { rule: state.ruleIds, 'yes-action': state.yesActionIds, 'no-action': state.noActionIds };
      sets[target.dataset.addOptionKind]?.add(target.value);
      if (target.dataset.addOptionKind === 'no-action') state.noPathOpen = true;
    }
    if (target.dataset.optionKind) {
      const sets = { rule: state.ruleIds, 'yes-action': state.yesActionIds, 'no-action': state.noActionIds };
      const set = sets[target.dataset.optionKind];
      target.checked ? set.add(target.value) : set.delete(target.value);
    }
    render();
  });

  render();
})();</script>
</body>
</html>
