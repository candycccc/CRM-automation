<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WeQuote Quote Lifecycle Automation Guide</title>
  <style>
  :root { color-scheme: light; --ink:#172538; --muted:#657286; --paper:#ffffff; --surface:#ffffff; --line:#d8dde4; --soft:#eef1f5; --accent:#e64c68; --navy:#243f63; --teal:#167c80; --green:#167653; --amber:#9a681f; --red:#a43e4d; --shadow:0 18px 48px rgba(24,37,56,.09); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#fff; color:var(--ink); }
  button,input,select { font:inherit; }
  button { color:inherit; }
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible { outline:3px solid rgba(230,76,104,.32); outline-offset:2px; }
  #qlce-root { min-height:100vh; background:#fff; }
  .qlce-companion-nav { min-height:46px; padding:7px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); background:#fff; color:var(--muted); }
  .qlce-companion-nav span { line-height:1.4; }
  .qlce-companion-nav strong { color:var(--ink); }
  .qlce-companion-nav a { min-height:36px; padding:7px 11px; display:inline-flex; align-items:center; border:1px solid var(--line); color:var(--navy); background:#fff; text-decoration:none; font-weight:700; white-space:nowrap; }
  .qlce-companion-nav a:hover { border-color:#8ba1b8; }
  .qlce-header { background:#fff; border-bottom:1px solid var(--line); }
  .qlce-header-main,.qlce-toolbar,.qlce-stage-nav,main,.qlce-footer,.qlce-disclaimer { max-width:1500px; margin-inline:auto; }
  .qlce-header-main { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:48px; align-items:end; padding:48px 32px 28px; }
  .qlce-kicker,.qlce-builder-heading>span,.qlce-catalogue-heading>div>span { display:block; color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(42px,5vw,72px); line-height:.94; letter-spacing:-.045em; margin:0 0 20px; max-width:900px; }
  .qlce-header-main p { color:var(--muted); font-size:18px; line-height:1.55; margin:0; max-width:760px; }
  .qlce-source-card { background:rgba(255,255,255,.82); border:1px solid var(--line); box-shadow:var(--shadow); padding:22px; display:grid; gap:8px; }
  .qlce-source-card strong { color:var(--green); font-size:16px; }
  .qlce-source-card span { color:var(--ink); line-height:1.45; }
  .qlce-source-card small { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .qlce-disclaimer { border:1px solid #e8c8ce; background:#fff7f8; padding:12px 16px; margin-bottom:20px; line-height:1.45; }
  .qlce-toolbar { display:flex; gap:16px; align-items:center; padding:0 32px 18px; }
  .qlce-mode-nav { display:flex; background:#e8e8e5; padding:4px; gap:3px; }
  .qlce-mode-nav button,.qlce-type-tabs button { border:0; background:transparent; min-height:42px; padding:8px 14px; font-weight:700; cursor:pointer; }
  .qlce-mode-nav button.is-active,.qlce-type-tabs button.is-active { background:var(--surface); box-shadow:0 2px 9px rgba(20,30,45,.09); }
  .qlce-search { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; font-weight:700; }
  .qlce-search input,.qlce-select-grid select,.qlce-rule-join select,.qlce-guided-select select,.qlce-guided-add select { min-height:42px; border:1px solid var(--line); background:var(--surface); padding:8px 12px; color:var(--ink); }
  .qlce-toolbar>button,.qlce-actions-row button { border:1px solid var(--line); background:var(--surface); min-height:42px; padding:8px 14px; font-weight:700; cursor:pointer; }
  .qlce-stage-nav { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; padding:0 32px; }
  .qlce-stage { position:relative; border:0; border-top:3px solid transparent; background:rgba(255,255,255,.55); min-height:88px; text-align:left; padding:12px; cursor:pointer; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-content:center; }
  .qlce-stage.is-active { background:var(--surface); border-top-color:var(--stage-accent); }
  .qlce-stage-index { grid-row:1/3; color:var(--stage-accent); font-family:ui-monospace,SFMono-Regular,monospace; font-size:12px; padding-top:2px; }
  .qlce-stage>span:nth-child(2) { font-weight:800; }
  .qlce-stage small { color:var(--muted); }
  main { padding:28px 32px 50px; background:#fff; }
  .qlce-context-strip { display:grid; grid-template-columns:1fr 360px; gap:28px; border-left:5px solid var(--stage-accent); background:var(--surface); padding:18px 22px; margin-bottom:16px; box-shadow:0 5px 22px rgba(28,40,58,.05); }
  .qlce-context-strip h2,.qlce-pane-title h2,.qlce-detail-heading h2,.qlce-contract-heading h2,.qlce-catalogue-heading h2 { margin:0; font-size:20px; }
  .qlce-context-strip p { color:var(--muted); margin:5px 0 0; }
  .qlce-context-strip>div:first-child>span { color:var(--stage-accent); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.09em; }
  .qlce-context-strip>div:last-child { border-left:1px solid var(--line); padding-left:24px; display:grid; gap:5px; align-content:center; }
  .qlce-context-strip small { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .qlce-workbench { display:grid; grid-template-columns:270px minmax(420px,1fr) 380px; gap:16px; align-items:start; }
  .qlce-pane,.qlce-builder-controls,.qlce-builder-result,.qlce-catalogue-heading,.qlce-protected { background:var(--surface); border:1px solid var(--line); box-shadow:0 8px 28px rgba(30,43,61,.055); }
  .qlce-pane { min-height:620px; padding:18px; }
  .qlce-pane-title { display:flex; gap:12px; align-items:center; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:15px; }
  .qlce-pane-title>span { width:30px; height:30px; border-radius:50%; background:var(--navy); color:white; display:grid; place-items:center; font-weight:800; flex:0 0 auto; }
  .qlce-pane-title p { margin:3px 0 0; color:var(--muted); font-size:13px; }
  .qlce-list-group { margin-top:18px; }
  .qlce-list-group h3 { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.09em; margin:0 0 8px; }
  .qlce-trigger-option { width:100%; border:0; border-left:3px solid transparent; background:transparent; text-align:left; padding:10px 9px; display:grid; grid-template-columns:auto 1fr; gap:3px 8px; cursor:pointer; }
  .qlce-trigger-option:hover { background:var(--soft); }
  .qlce-trigger-option.is-active { background:#edf3f6; border-left-color:var(--navy); }
  .qlce-trigger-option.is-disabled { opacity:.58; cursor:not-allowed; }
  .qlce-trigger-option.is-beginner { grid-template-columns:1fr; }
  .qlce-trigger-option small { grid-column:2; color:var(--muted); font-size:11px; }
  .qlce-id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; font-weight:800; color:var(--navy); white-space:nowrap; }
  .qlce-contract { background:#f7f9fa; border:1px solid var(--line); padding:16px; margin-bottom:16px; }
  .qlce-contract-heading,.qlce-detail-heading { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
  .qlce-contract-heading>div,.qlce-detail-heading>div { display:grid; gap:4px; }
  .qlce-contract dl { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); margin:14px 0; }
  .qlce-contract dl>div { background:var(--surface); padding:10px; }
  .qlce-contract dt { color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .qlce-contract dd { margin:4px 0 0; line-height:1.4; font-size:13px; }
  .qlce-contract details { font-size:13px; color:var(--muted); }
  .qlce-contract summary { cursor:pointer; font-weight:800; color:var(--navy); }
  .qlce-recipe-list { display:grid; gap:9px; }
  .qlce-recipe-card { border:1px solid var(--line); background:var(--surface); text-align:left; padding:13px; cursor:pointer; display:grid; gap:7px; }
  .qlce-recipe-card:hover,.qlce-recipe-card.is-active { border-color:#8ba1b8; box-shadow:0 5px 15px rgba(32,55,82,.08); }
  .qlce-recipe-card.is-active { border-left:4px solid var(--accent); }
  .qlce-recipe-card.is-withheld { background:#fbf4f5; }
  .qlce-recipe-card>span:last-child { color:var(--muted); line-height:1.4; }
  .qlce-recipe-top,.qlce-result-status { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .qlce-pill { display:inline-flex; align-items:center; min-height:24px; padding:3px 8px; font-size:10px; font-weight:800; border:1px solid currentColor; white-space:nowrap; }
  .qlce-pill-candidate,.qlce-pill-live { color:var(--green); background:#edf8f3; }
  .qlce-pill-adapter-required { color:#386796; background:#eef5fb; }
  .qlce-pill-new-runtime,.qlce-pill-proposed,.qlce-pill-phase1-build-required,.qlce-pill-contract-required { color:var(--amber); background:#fbf6e9; }
  .qlce-pill-withheld { color:var(--red); background:#fbf0f2; }
  .qlce-pill-exploratory { color:#685d87; background:#f3f0f9; }
  .qlce-detail-card { display:grid; gap:15px; }
  .qlce-flow { display:grid; gap:7px; }
  .qlce-flow-row { display:grid; grid-template-columns:132px 1fr; gap:10px; align-items:start; }
  .qlce-flow-row>span { min-height:32px; display:grid; place-items:center; padding:5px 8px; background:var(--navy); color:#fff; font-size:9px; font-weight:900; letter-spacing:.055em; text-align:center; }
  .qlce-flow-row p { margin:0; padding:5px 0; line-height:1.45; }
  .qlce-flow-wait>span { background:#81714f; }
  .qlce-flow-if>span { background:#6c5a8f; }
  .qlce-flow-yes>span { background:var(--green); }
  .qlce-flow-no>span { background:#697587; }
  .qlce-reason { border-left:3px solid var(--accent); padding:9px 12px; background:#fff7f8; }
  .qlce-reason span,.qlce-dual-status small { color:var(--muted); font-size:10px; text-transform:uppercase; font-weight:800; letter-spacing:.07em; }
  .qlce-reason p { margin:4px 0 0; line-height:1.45; }
  .qlce-dual-status { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); }
  .qlce-dual-status>div { background:var(--surface); display:grid; gap:5px; padding:11px; }
  .qlce-dual-status>div>span { color:var(--muted); font-size:11px; line-height:1.4; }
  .qlce-blockers { border:1px solid var(--line); background:#f7f9fa; padding:13px; }
  .qlce-blockers>strong,.qlce-blocker-summary>strong { display:block; margin-bottom:8px; }
  .qlce-blockers ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  .qlce-blockers li { display:grid; grid-template-columns:minmax(120px,auto) 1fr; gap:10px; align-items:start; }
  .qlce-blockers li div { display:grid; gap:2px; }
  .qlce-blockers li small { color:var(--muted); line-height:1.35; }
  .qlce-blocker-summary { border-left:3px solid var(--amber); background:#fbf6e9; padding:10px 12px; font-size:12px; line-height:1.45; }
  .qlce-actions-row { display:flex; flex-wrap:wrap; gap:8px; }
  .qlce-actions-row .qlce-primary { background:var(--navy); color:white; border-color:var(--navy); }
  .qlce-actions-row button:disabled { opacity:.45; cursor:not-allowed; }
  .qlce-empty,.qlce-muted { color:var(--muted); line-height:1.5; }
  .qlce-build-layout { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:16px; align-items:start; }
  .qlce-builder-controls,.qlce-builder-result { padding:22px; }
  .qlce-builder-result { position:sticky; top:16px; }
  .qlce-builder-heading h2,.qlce-catalogue-heading h2 { font-size:28px; margin:0; }
  .qlce-builder-heading p,.qlce-catalogue-heading p { color:var(--muted); margin:7px 0 0; }
  .qlce-select-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0; }
  .qlce-select-grid label { display:grid; gap:6px; color:var(--muted); font-size:12px; font-weight:800; }
  .qlce-guided-stack { display:grid; gap:12px; margin-top:20px; }
  .qlce-guided-step { border:1px solid var(--line); background:#fbfcfd; padding:18px; }
  .qlce-guided-step-heading { display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:start; }
  .qlce-guided-step-heading>span { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--navy); color:#fff; font-weight:900; }
  .qlce-guided-step-heading h3 { margin:2px 0 0; font-size:18px; }
  .qlce-guided-step-heading h3 em { color:var(--muted); font-size:11px; font-style:normal; text-transform:uppercase; letter-spacing:.06em; margin-left:6px; }
  .qlce-guided-step-heading p { margin:4px 0 0; color:var(--muted); line-height:1.4; }
  .qlce-guided-step-heading>button { border:1px solid var(--line); background:var(--surface); min-height:36px; padding:6px 12px; cursor:pointer; font-weight:800; }
  .qlce-guided-step .qlce-select-grid { margin:16px 0 0; }
  .qlce-guided-select { display:grid; gap:6px; margin-top:12px; color:var(--muted); font-size:12px; font-weight:800; }
  .qlce-guided-select small { font-weight:500; line-height:1.4; }
  .qlce-guided-empty { margin:14px 0 10px 44px; padding:11px 13px; border-left:3px solid #96a3b4; background:#f1f4f7; color:var(--muted); }
  .qlce-guided-empty.is-required { border-left-color:var(--amber); background:#fbf6e9; color:var(--ink); }
  .qlce-guided-add { margin:12px 0 0 44px; }
  .qlce-guided-add select { width:100%; }
  .qlce-selected-list { display:grid; gap:7px; margin:14px 0 0 44px; }
  .qlce-selected-item { display:grid; grid-template-columns:minmax(0,1fr) 34px; gap:10px; align-items:start; border:1px solid var(--line); background:var(--surface); padding:10px 10px 10px 12px; }
  .qlce-selected-item.is-invalid { border-color:#d28a92; background:#fff5f6; box-shadow:inset 3px 0 0 #b43f4c; }
  .qlce-selected-item.is-invalid small { color:#8c303a; }
  .qlce-selected-item>span { display:grid; gap:3px; }
  .qlce-selected-item small { color:var(--muted); line-height:1.35; }
  .qlce-selected-item button { border:0; background:transparent; min-height:30px; font-size:22px; color:var(--muted); cursor:pointer; }
  .qlce-guided-step>.qlce-rule-join { margin:12px 0 0 44px; }
  .qlce-optional-path { margin:12px 0 0 44px; }
  .qlce-optional-path>p { color:var(--muted); line-height:1.45; }
  .qlce-optional-path .qlce-selected-list,.qlce-optional-path .qlce-guided-add { margin-left:0; }
  .qlce-advanced-disclosure { border:1px solid var(--line); margin-top:16px; background:var(--surface); }
  .qlce-advanced-toggle { width:100%; border:0; background:#f4f6f8; display:flex; justify-content:space-between; gap:20px; align-items:center; padding:14px 16px; text-align:left; cursor:pointer; }
  .qlce-advanced-toggle>span { display:grid; gap:3px; }
  .qlce-advanced-toggle small { color:var(--muted); }
  .qlce-advanced-toggle>b { font-size:22px; }
  .qlce-advanced-disclosure.is-open .qlce-advanced-toggle { border-bottom:1px solid var(--line); }
  .qlce-advanced-body { padding:16px; }
  .qlce-advanced-body>p { margin:0; color:var(--muted); line-height:1.45; }
  .qlce-reset-row { justify-content:flex-end; margin-top:14px; }
  .qlce-logic-guide { display:grid; grid-template-columns:auto 1fr; gap:5px 12px; align-items:start; padding:13px 14px; border:1px solid #d9cff6; background:#f7f3ff; color:#4d3d70; }
  .qlce-logic-guide strong { color:#4d3188; }
  .qlce-logic-guide span { line-height:1.45; }
  .qlce-logic-guide code { grid-column:1/-1; width:max-content; max-width:100%; padding:5px 8px; border-radius:6px; background:#ebe3ff; color:#56369a; font-weight:800; overflow:auto; }
  .qlce-choice-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:18px; }
  .qlce-field-help { min-height:42px; margin:0 0 8px; color:var(--muted); font-size:11px; line-height:1.4; }
  .qlce-rule-join { display:grid; gap:5px; margin-bottom:9px; color:var(--muted); font-size:11px; font-weight:800; }
  fieldset { min-width:0; border:1px solid var(--line); margin:0; padding:12px; }
  legend { font-weight:900; padding:0 5px; }
  .qlce-option-scroll { max-height:480px; overflow:auto; display:grid; gap:5px; }
  .qlce-check-option { display:grid; grid-template-columns:auto 1fr; gap:9px; align-items:start; padding:8px; cursor:pointer; border:1px solid transparent; }
  .qlce-check-option:hover { border-color:var(--line); background:#fafbfc; }
  .qlce-check-option input { width:18px; height:18px; margin:1px 0 0; accent-color:var(--accent); }
  .qlce-check-option>span { display:grid; gap:3px; }
  .qlce-check-option small { color:var(--muted); line-height:1.3; }
  .qlce-check-option.is-disabled { opacity:.52; cursor:not-allowed; }
  .qlce-pricing-chooser { margin:18px 0; display:grid; grid-template-columns:repeat(7,minmax(130px,1fr)); gap:8px; }
  .qlce-price-option { border:1px solid var(--line); padding:10px; cursor:pointer; min-height:132px; }
  .qlce-price-option.is-active { border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); background:#f1f8f7; }
  .qlce-price-option input { position:absolute; opacity:0; }
  .qlce-price-option span { display:grid; gap:6px; }
  .qlce-price-option small { color:var(--muted); line-height:1.35; }
  .qlce-price-option em { color:var(--teal); font-size:11px; font-style:normal; font-weight:800; }
  .qlce-check-result { display:grid; gap:14px; }
  .qlce-automation-check { border:1px solid var(--line); background:#f7faf9; }
  .qlce-automation-check.has-errors { background:#fffaf2; }
  .qlce-check-heading { display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:start; padding:16px; border-bottom:1px solid var(--line); }
  .qlce-check-icon { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:#e5f5ee; color:var(--green); font-size:22px; font-weight:900; }
  .has-errors .qlce-check-icon { background:#fff0d8; color:var(--amber); }
  .qlce-check-heading small { color:var(--accent); font-weight:900; letter-spacing:.09em; }
  .qlce-check-heading h2 { margin:3px 0 0; font-size:20px; }
  .qlce-check-heading p { margin:5px 0 0; color:var(--muted); line-height:1.4; }
  .qlce-check-list { display:grid; }
  .qlce-check-list>div { display:grid; grid-template-columns:26px 1fr; gap:9px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .qlce-check-list>div>span { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:#e5f5ee; color:var(--green); font-weight:900; }
  .qlce-check-list>div.is-fail>span { background:#fff0d8; color:var(--amber); }
  .qlce-check-list p { display:grid; gap:3px; margin:0; }
  .qlce-check-list small { color:var(--muted); line-height:1.35; }
  .qlce-check-notice { display:grid; gap:4px; padding:12px 14px; background:#eef5fb; color:#315f8d; }
  .qlce-activation-note { margin:0; padding:12px 14px; color:var(--muted); font-size:12px; line-height:1.4; }
  .qlce-check-actions { margin-top:2px; }
  .qlce-sample-test { border:1px solid #cfd9e7; background:#f5f8fc; padding:14px; }
  .qlce-sample-heading { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
  .qlce-sample-heading small { color:var(--navy); font-weight:900; letter-spacing:.07em; }
  .qlce-sample-heading h3 { margin:3px 0 0; }
  .qlce-sample-heading>button { border:0; background:transparent; color:var(--muted); font-size:22px; cursor:pointer; }
  .qlce-branch-toggle { display:flex; gap:4px; background:#e7ebf1; padding:4px; margin-top:12px; }
  .qlce-branch-toggle button { flex:1; min-height:36px; border:0; background:transparent; cursor:pointer; font-weight:800; }
  .qlce-branch-toggle button.is-active { background:var(--surface); box-shadow:0 2px 7px rgba(26,43,64,.1); }
  .qlce-sample-steps { list-style:none; display:grid; gap:0; padding:0; margin:14px 0; }
  .qlce-sample-steps li { display:grid; grid-template-columns:28px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid #dbe2ec; }
  .qlce-sample-steps li>span { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--navy); color:#fff; font-size:11px; font-weight:900; }
  .qlce-sample-steps li>div { display:grid; gap:2px; }
  .qlce-sample-steps small { color:var(--muted); line-height:1.4; }
  .qlce-sample-test>p { margin:0; color:var(--muted); font-size:12px; line-height:1.45; }
  .qlce-readiness-details { border-top:1px solid var(--line); padding-top:12px; }
  .qlce-readiness-details summary { color:var(--navy); font-weight:800; cursor:pointer; }

ganisation's Quote Review setting.","evidence":"This setting already exists in WeQuote.","readiness":"live"},"IP-R02":{"id":"IP-R02","label":"Is required Quote pricing missing?","scope":"context","availability":"withheld","settings":"Nothing can be chosen until the team agrees which prices are required.","evaluation":"WeQuote cannot yet decide when the Quote's pricing is complete or incomplete.","evidence":"Pricing information exists, but there is no agreed list of required prices. You cannot use this Rule yet.","readiness":"withheld"},"IP-R04":{"id":"IP-R04","label":"Is required work information (Statement of Work / SOW) missing?","scope":"context","availability":"withheld","settings":"Nothing can be chosen until the team agrees where the required work information is stored.","evaluation":"WeQuote cannot yet decide whether all required work information has been added.","evidence":"There is no agreed source or list of required work information. You cannot use this Rule yet.","readiness":"withheld"},"IR-R01":{"id":"IR-R01","label":"Is the Quote still In Review?","scope":"context","availability":"selectable","settings":"Nothing else to choose.","evaluation":"Checks that the Quote is still In Review and is the latest version.","evidence":"WeQuote already knows the Quote's Stage.","readiness":"live"},"IR-R02":{"id":"IR-R02","label":"Is there nobody who can review the Quote?","scope":"context","availability":"selectable","settings":"Nothing else to choose.","evaluation":"Answers Yes only when there is no review email and no active user has permission to review Quotes.","evidence":"Both pieces of information exist now. WeQuote still needs to check them together.","readiness":"adapter-required"},"IR-R03":{"id":"IR-R03","label":"What is the technical review Note's status?","scope":"context","availability":"selectable","settings":"Choose Missing, Open or Complete, then choose the technical-review follow-up type.","evaluation":"Looks for the exact technical review follow-up t
